# Baut und testet den Rechner auf Linux, Windows und macOS.
# Bei jedem Push: nur bauen und testen.
# Bei einem Tag wie "folge-01-v1": zusätzlich fertige Programme unter "Releases" bereitstellen.
# Die Schritte entsprechen denen in INSTALLATION.md; läuft es hier, läuft die Anleitung auch.
name: bauen

on:
  push:
    branches: [main]
    tags: ["folge-*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: folge-01 } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y flex bison
      - run: make LDFLAGS=-static        # statisch: läuft auf jeder Linux-Verteilung
      - run: ./test.sh
      - run: mkdir -p ../paket && cp rechner ../LICENSE ../paket/
      - uses: actions/upload-artifact@v4
        with: { name: rechner-linux-x86_64, path: paket/ }

  windows:
    runs-on: windows-latest
    defaults: { run: { shell: "msys2 {0}", working-directory: folge-01 } }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make flex bison mingw-w64-ucrt-x86_64-gcc
      - run: make LDFLAGS=-static        # statisch: rechner.exe braucht keine MSYS2-Dateien
      - run: ./test.sh
      - run: mkdir -p ../paket && cp rechner.exe ../LICENSE ../paket/
      - uses: actions/upload-artifact@v4
        with: { name: rechner-windows-x86_64, path: paket/ }

  macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: folge-01 } }
    steps:
      - uses: actions/checkout@v4
      - run: brew install bison          # macOS bringt nur Bison 2.3 (2006) mit
      - run: make BISON="$(brew --prefix bison)/bin/bison" CFLAGS="-Wall -Wextra -O2 -arch arm64 -arch x86_64"
      - run: lipo -info rechner          # ein Programm für Apple-Chips und Intel-Macs
      - run: ./test.sh
      - run: mkdir -p ../paket && cp rechner ../LICENSE ../paket/
      - uses: actions/upload-artifact@v4
        with: { name: rechner-macos-universal, path: paket/ }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
      - run: for d in rechner-*; do (cd "$d" && chmod +x rechner* && zip -q "../$d.zip" *); done
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${{ github.ref_name }}" rechner-*.zip --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --notes "Fertige Programme zum Ausprobieren. Anleitung in INSTALLATION.md"
